app = "helios-rossadams-db"
primary_region = "ewr"

[build]
  image = "postgis/postgis:16-3.4"

[env]
  POSTGRES_USER = "helios"
  POSTGRES_DB = "helios"
  PGDATA = "/var/lib/postgresql/data/pgdata"

[mounts]
  source = "pgdata"
  destination = "/var/lib/postgresql/data"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
